name: gestor_de_gastos
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0 # Para localización

  # State Management
  riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  state_notifier: ^1.0.0 # Aunque incluido en riverpod, mejor explicitar

  # Routing
  go_router: ^14.0.0

  # Dependency Injection
  get_it: ^7.6.7

  # Database (Local)
  drift: ^2.17.0
  sqlite3_flutter_libs: ^0.5.0
  sqlcipher_flutter_libs: ^0.6.0 # Para cifrado
  path_provider: ^2.1.2
  path: ^0.8.4

  # Database (Remote) & Auth
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Data Handling
  freezed_annotation: ^0.18.0
  json_annotation: ^4.8.1

  # UI & Utilities
  material_design_icons_flutter: ^7.0.7296 # Iconos extras
  fl_chart: ^0.68.0 # Gráficos
  image_picker: ^1.1.1 # Imagen de recibo
  permission_handler: ^11.3.1 # Permisos
  printing: ^5.12.0 # PDF
  pdf: ^3.10.4 # PDF
  csv: ^5.1.1 # CSV
  share_plus: ^9.0.0 # Compartir (opcional, para exportación)
  shared_preferences: ^2.2.3 # Flags de onboarding
  local_auth: ^2.2.0 # Biometría
  flutter_native_splash: ^2.4.0 # Splash screen (opcional)
  responsive_breakpoints: ^0.3.2 # Responsive

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^0.24.7
  json_serializable: ^6.8.0
  drift_dev: ^2.17.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
